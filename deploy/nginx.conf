# Runs as an arbitrary non-root UID on OpenShift; all writable paths are under /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    # Real client IP from Cloudflare (tunnel connects from inside the cluster).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;
    log_format main '$remote_addr "$request" $status $body_bytes_sent "$http_user_agent" rt=$request_time';
    access_log /dev/stdout main;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;

    # Static site: no request bodies, small headers, slow-loris protection.
    client_max_body_size 1k;
    client_body_buffer_size 1k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;

    # Per-IP limits (defence in depth behind Cloudflare).
    limit_req_zone  $binary_remote_addr zone=perip:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=connip:10m;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_types text/css application/javascript application/wasm;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        autoindex off;
        etag on;

        limit_req  zone=perip burst=40 nodelay;
        limit_conn connip 20;
        limit_req_status 429;
        limit_conn_status 429;

        # --- Security headers (always, incl. error responses) ---
        # wasm-unsafe-eval: required to compile the Slint WASM module; no JS eval allowed.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Robots-Tag "noai, noimageai" always;

        # Only GET/HEAD for a static site.
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = / {
            try_files /index.html =404;
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/security-headers.conf;
        }

        # Allowlist of servable files; everything else 404s.
        location ~ ^/(index\.html|loader\.css|loader\.js)$ {
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/security-headers.conf;
        }
        location = /cfp/cfp.text {
            default_type text/plain;
            types { }
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/security-headers.conf;
        }
        # Content-hashed paths never change content -> cache forever.
        location ~ "^/pkg/[0-9a-f]{16}/(vhpc26\.js|vhpc26_bg\.wasm|snippets/[A-Za-z0-9_.-]+/inline[0-9]+\.js)$" {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/security-headers.conf;
        }

        location / { return 404; }
    }
}
